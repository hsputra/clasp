[package]
name = "clasp"
version = "0.1.0"
edition = "2021"
description = "Fast, type-safe JWT/JWKS verification for Python, in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hsputra/clasp"

[lib]
name = "clasp"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", optional = true }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1
